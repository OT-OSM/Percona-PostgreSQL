---
- name: CIS | Ensure postgres admin variables are set
  set_fact:
    postgres_admin_user: "{{ postgres_admin_user | default('postgres') }}"
    postgres_admin_password: "{{ postgres_admin_password | default(omit) }}"
    postgres_port: "{{ postgres_port | default(5432) }}"
  tags: [cis, cis_auth]

# CIS 5.3 / 5.4 – Verify peer & trust are not used
- name: CIS | Remove peer and trust authentication
  replace:
    path: /etc/postgresql/{{ version }}/main/pg_hba.conf
    regexp: '^(local|host).*\\s(peer|trust)\\s*$'
    replace: ''
  notify: Reload PostgreSQL
  tags:
    - cis
    - cis_auth

# CIS 4.3 – Ensure no extra superusers
- name: CIS | Check for unexpected superusers
  community.postgresql.postgresql_query:
    db: postgres
    login_user: "{{ postgres_admin_user }}"
    login_password: "{{ postgres_admin_password }}"
    login_host: 127.0.0.1
    port: "{{ postgres_port }}"
    query: |
      SELECT rolname FROM pg_roles
      WHERE rolsuper = true AND rolname != 'postgres';
  register: superusers
  failed_when:
  - superusers is defined
  - superusers.rowcount | default(0) > 0
  tags: [cis, cis_auth]

- name: CIS | Ensure PostgreSQL restarted after auth changes
  service:
    name: postgresql
    state: restarted
  tags: [cis, cis_auth]
