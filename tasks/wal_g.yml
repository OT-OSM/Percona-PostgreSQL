---
- name: Download WAL-G
  ansible.builtin.get_url:
    url: "https://github.com/wal-g/wal-g/releases/download/{{ percona_postgresql_walg_version }}/{{ percona_postgresql_walg_binary }}"
    dest: /tmp/wal-g.tar.gz
    mode: '0644'

- name: Extract WAL-G
  ansible.builtin.unarchive:
    src: /tmp/wal-g.tar.gz
    dest: /tmp
    remote_src: true

- name: Install WAL-G
  ansible.builtin.copy:
    src: /tmp/wal-g-pg-ubuntu-20.04-amd64
    dest: /usr/local/bin/wal-g
    remote_src: true
    mode: '0755'

- name: Create WAL-G envdir
  ansible.builtin.file:
    path: "{{ percona_postgresql_walg_envdir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'

- name: Configure WAL-G environment
  ansible.builtin.template:
    src: wal-g.json.j2
    dest: "{{ percona_postgresql_walg_envdir }}/env.json"
    owner: postgres
    group: postgres
    mode: '0644'

- name: Enable archive_mode
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: '^archive_mode'
    line: "archive_mode = on"

- name: Configure archive_command
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: '^archive_command'
    line: >
      archive_command = 'envdir {{ percona_postgresql_walg_envdir }}
      wal-g wal-push %p'

- name: Configure restore_command
  ansible.builtin.lineinfile:
    path: /etc/postgresql/16/main/postgresql.conf
    regexp: '^restore_command'
    line: >
      restore_command = 'envdir {{ percona_postgresql_walg_envdir }}
      wal-g wal-fetch %f %p'

- name: Deploy full backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/bin/postgres_full_backup.sh
    mode: '0755'

- name: Deploy restore script
  ansible.builtin.template:
    src: restore.sh.j2
    dest: /usr/local/bin/postgres_restore.sh
    mode: '0755'

- name: Deploy retention script
  ansible.builtin.template:
    src: retention.sh.j2
    dest: /usr/local/bin/postgres_retention.sh
    mode: '0755'

- name: Schedule full backup
  ansible.builtin.cron:
    name: postgres full backup
    user: postgres
    job: "/usr/local/bin/postgres_full_backup.sh"
    minute: "0"
    hour: "1"

- name: Schedule delta backup
  ansible.builtin.cron:
    name: postgres delta backup
    user: postgres
    job: >
      envdir {{ percona_postgresql_walg_envdir }}
      wal-g backup-push --delta
      {{ percona_postgresql_walg_backup_dir }}
    minute: "0"
    hour: "*/6"

- name: Schedule retention cleanup
  ansible.builtin.cron:
    name: postgres retention
    user: postgres
    job: "/usr/local/bin/postgres_retention.sh"
    minute: "30"
    hour: "2"

- name: Restart PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: restarted