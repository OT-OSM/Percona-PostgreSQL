#######################
# Load OS specific vars
#######################
- name: Load OS specific variables
  include_vars:
    file: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
    - "{{ ansible_distribution }}.yml"
  vars:
    ansible_search_path:
      - "{{ role_path }}/vars"

#######################
# OS-specific install
#######################
- name: Include OS-specific installation tasks
  include_tasks: "{{ ansible_distribution }}.yml"

#######################
# PostgreSQL base config
#######################
- name: Configure PostgreSQL
  include_tasks: configure.yml

#######################
# PostgreSQL extensions
#######################
- name: PostgreSQL extensions
  include_tasks: extensions/pgvector.yml
  when: pgvector_enabled
  tags:
    - extensions
    - pgvector

###########################
# PostgreSQL CIS hardening
###########################
- name: Apply CIS PostgreSQL hardening
  import_tasks: cis/main.yml
  tags: cis

#######################
# Replication
#######################
- name: Replication setup
  include_tasks: replication.yml
  when: replication | default(false)

#######################
# DB + User management
#######################
- name: Database creation
  include_tasks: database.yml
  when: database_creation | default(false)
  tags:
    - create_database

- name: User creation
  include_tasks: users.yml
  when: users_creation | default(false)
  tags:
    - create_user
