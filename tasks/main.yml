---
- name: Gather OS specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install Percona PostgreSQL packages
  ansible.builtin.include_tasks: install.yml
  when:
    - "'postgres' in groups"
    - inventory_hostname in groups['postgres']

- name: Configure ETCD
  ansible.builtin.include_tasks: etcd.yml
  when:
    - "'etcd' in groups"
    - inventory_hostname in groups['etcd']
  
- name: Calculate PostgreSQL dynamic configuration
  ansible.builtin.include_tasks: calculate_postgresql_config.yml
  when:
    - percona_postgresql_enable_dynamic_config | default(true)
    - "'postgres' in groups"
    - inventory_hostname in groups['postgres']

- name: Configure Patroni
  ansible.builtin.include_tasks: patroni.yml
  when:
    - "'postgres' in groups"
    - inventory_hostname in groups['postgres']


- name: Apply Patroni configuration immediately
  ansible.builtin.meta: flush_handlers
  when:
    - "'postgres' in group_names"

- name: Configure PostgreSQL Extensions
  ansible.builtin.include_tasks: postgresql_extensions.yml
  when:
    - "'postgres' in group_names"


- name: Configure PostgreSQL Exporter
  ansible.builtin.include_tasks: postgres_exporter.yml
  when:
    - percona_postgresql_enable_postgres_exporter
    - "'postgres' in groups"
    - inventory_hostname in groups['postgres']

- name: Install Node Exporter
  ansible.builtin.include_tasks: node_exporter.yml
  when:
    - percona_postgresql_enable_node_exporter
    - "'postgres' in group_names or 'etcd' in group_names or 'haproxy' in group_names"

- name: Configure WAL-G DR
  ansible.builtin.include_tasks: wal_g.yml
  when:
    - percona_postgresql_enable_dr
    - "'postgres' in groups"
    - inventory_hostname in groups['postgres']

- name: Configure HAProxy
  ansible.builtin.include_tasks: haproxy.yml
  when:
    - "'haproxy' in groups"
    - inventory_hostname in groups['haproxy']
