---
- name: Create node_exporter group
  ansible.builtin.group:
    name: "{{ percona_postgresql_node_exporter_group }}"
    system: true
  when: percona_postgresql_enable_node_exporter | bool

- name: Create node_exporter user
  ansible.builtin.user:
    name: "{{ percona_postgresql_node_exporter_user }}"
    group: "{{ percona_postgresql_node_exporter_group }}"
    shell: /usr/sbin/nologin
    create_home: false
    system: true
  when: percona_postgresql_enable_node_exporter | bool

- name: Download Node Exporter archive
  ansible.builtin.get_url:
    url: "{{ percona_postgresql_node_exporter_download_url }}"
    dest: "/tmp/node_exporter-{{ percona_postgresql_node_exporter_version }}.tar.gz"
    mode: "0644"
  when: percona_postgresql_enable_node_exporter | bool

- name: Extract Node Exporter archive
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter-{{ percona_postgresql_node_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true
    creates: "/tmp/node_exporter-{{ percona_postgresql_node_exporter_version }}.linux-amd64"
  when: percona_postgresql_enable_node_exporter | bool

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ percona_postgresql_node_exporter_version }}.linux-amd64/node_exporter"
    dest: "{{ percona_postgresql_node_exporter_binary }}"
    owner: "{{ percona_postgresql_node_exporter_user }}"
    group: "{{ percona_postgresql_node_exporter_group }}"
    mode: "0755"
    remote_src: true
  notify: Restart node_exporter
  when: percona_postgresql_enable_node_exporter | bool

- name: Deploy node_exporter systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart node_exporter
  when: percona_postgresql_enable_node_exporter | bool

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
  when: percona_postgresql_enable_node_exporter | bool
