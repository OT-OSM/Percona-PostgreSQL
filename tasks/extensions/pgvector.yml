---
- name: Install pgvector package
  apt:
    name: postgresql-16-pgvector
    state: present
    force: yes
    update_cache: yes
  tags:
    - extensions
    - pgvector

- name: Reload PostgreSQL to load new extension
  service:
    name: postgresql
    state: reloaded
  tags:
    - extensions
    - pgvector

- name: Create pgvector extension
  shell: |
    sudo -u postgres psql -d rems_rca_metadata -c "CREATE EXTENSION IF NOT EXISTS pgvector;"
  tags:
    - extensions
    - pgvector

- name: Verify extension creation
  shell: |
    sudo -u postgres psql -d rems_rca_metadata -t -c "SELECT extname FROM pg_extension WHERE extname = 'pgvector';"
  register: verify_result
  changed_when: false
  tags:
    - extensions
    - pgvector

- name: Show verification result
  debug:
    msg: "pgvector extension: {{ 'ENABLED' if 'pgvector' in verify_result.stdout else 'NOT ENABLED' }}"
  tags:
    - extensions
    - pgvector
