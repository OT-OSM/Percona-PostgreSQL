---
- name: Install pgvector package
  apt:
    name: postgresql-{{ version }}-pgvector
    state: present
    update_cache: yes

- name: Enable pgvector extension
  become: true
  become_user: postgres
  community.postgresql.postgresql_ext:
    name: vector
    db: {{db_name}}
    state: present
    login_user: postgres
    login_unix_socket: /var/run/postgresql
