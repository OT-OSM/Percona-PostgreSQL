---
- name: Install pgvector package
  apt:
    name: postgresql-{{ postgresql_version | default('16') }}-pgvector
    state: present
    update_cache: yes
  tags:
    - extensions
    - pgvector

- name: Reload PostgreSQL to load new extension
  service:
    name: postgresql
    state: reloaded
  tags:
    - extensions
    - pgvector

- name: Enable pgvector extension
  community.postgresql.postgresql_ext:
    name: pgvector
    db: "{{ db_name }}"
    state: present
    login_user: postgres
    login_unix_socket: /var/run/postgresql
  become: true
  become_user: postgres
  tags:
    - extensions
    - pgvector
