---
- name: Install pgvector package
  apt:
    name:
      - python3-psycopg2
      - postgresql-{{version}}-pgvector
    state: present
    update_cache: yes
  tags:
    - extensions
    - pgvector

- name: Enable pgvector extension
  community.postgresql.postgresql_ext:
    db: "{{ db_name }}"
    name: pgvector
    state: present
    login_host: "{{ db_host }}"
    login_user: "{{ db_user }}"
    login_password: "{{ db_pass }}"
    login_port: "{{ db_port }}"
  tags:
    - extensions
    - pgvector
