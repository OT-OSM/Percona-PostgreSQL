---
- name: Stop and disable PostgreSQL
  service:
    name: postgresql
    state: stopped
    enabled: false

- name: Stop Patroni if running
  service:
    name: patroni
    state: stopped
  ignore_errors: true

- name: Kill old postgres processes
  shell: pkill -u postgres postgres || true

- name: Remove PostgreSQL data directory
  file:
    path: /var/lib/postgresql/{{ version }}/main
    state: absent

- name: Recreate PostgreSQL data directory
  file:
    path: /var/lib/postgresql/{{ version }}/main
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

- name: Remove old PostgreSQL config directory
  file:
    path: /etc/postgresql/{{ version }}/main
    state: absent

- name: Create Patroni Config Directory
  file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: '0755'

- name: Copy Patroni Config
  template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: '0644'

- name: Wait for etcd health
  uri:
    url: "http://{{ hostvars[groups['etcd'][0]]['ansible_host'] }}:2379/health"
    method: GET
    status_code: 200
  register: etcd_health
  retries: 20
  delay: 5
  until: etcd_health.status == 200

- name: Ensure Patroni service is enabled
  service:
    name: patroni
    enabled: true

- name: Start Patroni
  service:
    name: patroni
    state: started