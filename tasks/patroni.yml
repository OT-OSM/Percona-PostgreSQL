---
- name: Stop PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: stopped
    enabled: false

- name: Stop Patroni service
  ansible.builtin.service:
    name: patroni
    state: stopped
  failed_when: false

- name: Kill old PostgreSQL processes
  ansible.builtin.command:
    cmd: pkill -u postgres postgres
  failed_when: false
  changed_when: false

- name: Remove PostgreSQL data directory for fresh Patroni bootstrap
  ansible.builtin.file:
    path: "{{ percona_postgresql_data_dir }}"
    state: absent
  when: percona_postgresql_force_clean | bool

- name: Ensure PostgreSQL data directory exists
  ansible.builtin.file:
    path: "{{ percona_postgresql_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Remove PostgreSQL config directory
  ansible.builtin.file:
    path: "{{ percona_postgresql_config_dir }}"
    state: absent

- name: Create Patroni config directory
  ansible.builtin.file:
    path: "{{ percona_postgresql_patroni_config_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

- name: Configure Patroni
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ percona_postgresql_patroni_config_path }}"
    owner: postgres
    group: postgres
    mode: "0644"
  notify:
    - Restart patroni

- name: Wait for ETCD health
  ansible.builtin.uri:
    url: "http://{{ percona_postgresql_etcd_host }}:{{ percona_postgresql_etcd_client_port }}/health"
    method: GET
    status_code: 200
  register: percona_postgresql_etcd_health
  retries: 10
  delay: 5
  until: percona_postgresql_etcd_health.status == 200

- name: Enable and start Patroni service
  ansible.builtin.service:
    name: patroni
    enabled: true
    state: started
