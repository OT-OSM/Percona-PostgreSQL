---
- name: Stop PostgreSQL
  ansible.builtin.service:
    name: postgresql
    state: stopped
    enabled: false

- name: Stop Patroni
  ansible.builtin.service:
    name: patroni
    state: stopped
  ignore_errors: true

- name: Kill old PostgreSQL processes
  ansible.builtin.command:
    cmd: pkill -u postgres postgres
  ignore_errors: true
  changed_when: false

- name: Remove PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgres_data_dir }}"
    state: absent

- name: Recreate PostgreSQL data directory
  ansible.builtin.file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Remove PostgreSQL config directory
  ansible.builtin.file:
    path: "{{ postgres_config_dir }}"
    state: absent

- name: Create Patroni config directory
  ansible.builtin.file:
    path: "{{ patroni_config_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0755"

- name: Configure Patroni
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: "{{ patroni_config_path }}"
    owner: postgres
    group: postgres
    mode: "0644"
  notify:
    - restart patroni

- name: Wait for ETCD health
  ansible.builtin.uri:
    url: "http://{{ hostvars[groups['etcd'][0]]['ansible_host'] }}:{{ etcd_client_port }}/health"
    method: GET
    status_code: 200
  register: etcd_health
  retries: 10
  delay: 5
  until: etcd_health.status == 200

- name: Enable Patroni
  ansible.builtin.service:
    name: patroni
    enabled: true

- name: Start Patroni
  ansible.builtin.service:
    name: patroni
    state: started