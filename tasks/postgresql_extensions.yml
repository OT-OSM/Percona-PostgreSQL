---
- name: Wait for PostgreSQL to become available through HAProxy
  ansible.builtin.command:
    cmd: >
      pg_isready
      -h {{ percona_postgresql_sql_host }}
      -p {{ percona_postgresql_sql_port }}
      -U {{ percona_postgresql_superuser_username }}
  environment:
    PGPASSWORD: "{{ percona_postgresql_superuser_password }}"
  register: pg_ready
  retries: 30
  delay: 5
  until: pg_ready.rc == 0
  changed_when: false
  run_once: true

- name: Get all user databases
  ansible.builtin.command:
    cmd: >
      psql
      -h {{ percona_postgresql_sql_host }}
      -p {{ percona_postgresql_sql_port }}
      -U {{ percona_postgresql_superuser_username }}
      -d postgres
      -t -A
      -c "SELECT datname
          FROM pg_database
          WHERE datistemplate = false
          AND datallowconn = true
          ORDER BY datname;"
  environment:
    PGPASSWORD: "{{ percona_postgresql_superuser_password }}"
  register: postgres_databases
  changed_when: false
  run_once: true

- name: Check if pg_stat_statements exists
  ansible.builtin.command:
    cmd: >
      psql
      -h {{ percona_postgresql_sql_host }}
      -p {{ percona_postgresql_sql_port }}
      -U {{ percona_postgresql_superuser_username }}
      -d {{ item }}
      -tAc "SELECT 1 FROM pg_extension WHERE extname='pg_stat_statements';"
  environment:
    PGPASSWORD: "{{ percona_postgresql_superuser_password }}"
  loop: "{{ postgres_databases.stdout_lines }}"
  register: extension_check
  changed_when: false
  run_once: true

- name: Enable pg_stat_statements where missing
  ansible.builtin.command:
    cmd: >
      psql
      -h {{ percona_postgresql_sql_host }}
      -p {{ percona_postgresql_sql_port }}
      -U {{ percona_postgresql_superuser_username }}
      -d {{ item.item }}
      -c "CREATE EXTENSION pg_stat_statements;"
  environment:
    PGPASSWORD: "{{ percona_postgresql_superuser_password }}"
  loop: "{{ extension_check.results }}"
  when: item.stdout | trim != "1"
  run_once: true
