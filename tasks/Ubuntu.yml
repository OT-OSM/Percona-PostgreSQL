---
- name: "Update apt cache"
  apt:
    update_cache: true
    cache_valid_time: 300

- name: Add Percona Repository
  apt:
    autoremove: true
    update_cache: true
    deb: https://repo.percona.com/apt/percona-release_latest.{{ ansible_lsb.codename }}_all.deb
    state: present

- name: "Enable Percona repository"
  command: "percona-release setup ppg-{{ version }}"
  changed_when: true

- name: Check if community PostgreSQL is installed
  shell: dpkg -l | grep -E '^ii\s+postgresql-{{ version }}'
  register: pgdg_installed
  failed_when: false
  changed_when: false

- name: Install Percona PostgreSQL
  apt:
    name: "{{ debian_package }}"
    state: present
  when: pgdg_installed.rc != 0

# ADD THIS TASK: Initialize PostgreSQL cluster if it doesn't exist
- name: Check if PostgreSQL cluster exists
  shell: pg_lsclusters | grep "{{ version }}.*main"
  register: cluster_exists
  failed_when: false
  changed_when: false

- name: Initialize PostgreSQL cluster
  shell: pg_createcluster {{ version }} main --start
  when: cluster_exists.rc != 0
  changed_when: true
  notify: Restart postgresql

# REPLACE the "Start Postgresql service" task with this:
- name: Ensure PostgreSQL service is running
  service:
    name: postgresql
    state: started
    enabled: yes

# FIXED: Always set password, not just when cluster is created
- name: Temporarily set peer authentication for postgres user
  lineinfile:
    path: /etc/postgresql/{{ version }}/main/pg_hba.conf
    regexp: '^local\s+all\s+postgres\s+'
    line: 'local   all             postgres                                md5'
    backup: yes
  # Run this to ensure we can connect as postgres user without password

- name: Reload PostgreSQL for auth changes
  service:
    name: postgresql
    state: reloaded

- name: Set PostgreSQL admin password (using peer authentication)
  become: yes
  become_user: postgres
  shell: |
    psql -c "ALTER USER postgres WITH PASSWORD '{{ postgres_admin_password }}';"
  changed_when: true
  # Don't fail if already set
  failed_when: false

- name: Update pg_hba.conf for password authentication
  lineinfile:
    path: /etc/postgresql/{{ version }}/main/pg_hba.conf
    regexp: '^local\s+all\s+postgres\s+'
    line: 'local   all             postgres                                md5'
    backup: yes

- name: Final PostgreSQL reload
  service:
    name: postgresql
    state: reloaded
