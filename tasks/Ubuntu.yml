---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 300

- name: Ensure PostgreSQL common directory exists
  ansible.builtin.file:
    path: "{{ percona_postgresql_common_path }}"
    state: directory
    mode: "0755"

- name: Disable automatic PostgreSQL cluster creation
  ansible.builtin.copy:
    dest: "{{ percona_postgresql_createcluster_conf }}"
    content: |
      create_main_cluster = false
    owner: root
    group: root
    mode: "0644"

- name: Add Percona repository
  ansible.builtin.apt:
    deb: "{{ percona_postgresql_repo_url }}"
    state: present

- name: Check enabled Percona repositories
  ansible.builtin.command:
    cmd: percona-release show
  register: percona_release_show
  changed_when: false

- name: Enable Percona PostgreSQL repository
  ansible.builtin.command:
    cmd: "percona-release setup ppg-{{ percona_postgresql_version }}"
  when: "'ppg-{{ percona_postgresql_version }}' not in percona_release_show.stdout"

- name: Install Percona PostgreSQL packages
  ansible.builtin.apt:
    name: "{{ percona_postgresql_packages }}"
    state: present
    update_cache: true

- name: Stop standalone PostgreSQL service before Patroni management
  ansible.builtin.service:
    name: postgresql
    state: stopped
    enabled: false
  failed_when: false

- name: Disable default PostgreSQL cluster service for Patroni setup
  ansible.builtin.service:
    name: "postgresql@{{ percona_postgresql_version }}-main"
    state: stopped
    enabled: false
  failed_when: false
