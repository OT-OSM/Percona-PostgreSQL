---
###############################################################################
# PostgreSQL Cluster
###############################################################################

percona_postgresql_version: "16"

###############################################################################
# PostgreSQL
###############################################################################

percona_postgresql_user: "postgres"
percona_postgresql_group: "postgres"
percona_postgresql_service_name: "postgresql"

percona_postgresql_pg_port: 5432

percona_postgresql_data_dir: "/var/lib/postgresql/{{ percona_postgresql_version }}/main"
percona_postgresql_bin_dir: "/usr/lib/postgresql/{{ percona_postgresql_version }}/bin"
percona_postgresql_unix_socket_directories: "/var/run/postgresql"

percona_postgresql_config_dir: "/etc/postgresql/{{ percona_postgresql_version }}/main"
percona_postgresql_conf_file: "{{ percona_postgresql_config_dir }}/postgresql.conf"

percona_postgresql_patroni_nodes:
  - 192.168.8.19
  - 192.168.8.20
  - 192.168.8.27

###############################################################################
# Patroni
###############################################################################

percona_postgresql_patroni_enable: true

percona_postgresql_patroni_rest_port: 8008
percona_postgresql_patroni_rest_listen_address: "{{ ansible_default_ipv4.address }}"

percona_postgresql_patroni_config_dir: "/etc/patroni"
percona_postgresql_patroni_config_path: "/etc/patroni/patroni.yml"

percona_postgresql_patroni_ttl: 40
percona_postgresql_patroni_loop_wait: 10
percona_postgresql_patroni_retry_timeout: 10
percona_postgresql_patroni_maximum_lag_on_failover: 104857600


percona_postgresql_check_timeline: true
percona_postgresql_remove_data_directory_on_rewind_failure: true
percona_postgresql_remove_data_directory_on_diverged_timelines: true

percona_postgresql_synchronous_mode: false
percona_postgresql_synchronous_mode_strict: false
percona_postgresql_master_start_timeout: 300

percona_postgresql_log_line_prefix: "%m [%p] %u@%d %r "
percona_postgresql_log_hostname: "on"
percona_postgresql_log_replication_commands: "on"

###############################################################################
# ETCD
###############################################################################

percona_postgresql_etcd_enable: true

percona_postgresql_etcd_client_port: 2379
percona_postgresql_etcd_peer_port: 2380

percona_postgresql_etcd_data_dir: "/var/lib/etcd/default.etcd"
percona_postgresql_etcd_config_path: "/etc/etcd/etcd.conf.yaml"

percona_postgresql_etcd_cluster_token: "etcd-cluster"
percona_postgresql_etcd_cluster_state: "new"

percona_postgresql_etcd_reinitialize: false
percona_postgresql_etcd_heartbeat_interval: 100
percona_postgresql_etcd_election_timeout: 1000

###############################################################################
# HAProxy
###############################################################################

percona_postgresql_haproxy_enable: true

percona_postgresql_haproxy_port: 5000
percona_postgresql_haproxy_config_path: "/etc/haproxy/haproxy.cfg"

percona_postgresql_haproxy_frontend_name: "postgres_front"
percona_postgresql_haproxy_backend_name: "postgres_back"

percona_postgresql_haproxy_max_connections: 2000

percona_postgresql_haproxy_timeout_connect: "30s"
percona_postgresql_haproxy_timeout_client: "30m"
percona_postgresql_haproxy_timeout_server: "30m"
percona_postgresql_haproxy_timeout_check: "5s"

percona_postgresql_haproxy_health_check_interval: 3s
percona_postgresql_haproxy_health_check_fast_interval: 1s
percona_postgresql_haproxy_health_check_down_interval: 5s
percona_postgresql_haproxy_health_check_fall: 3
percona_postgresql_haproxy_health_check_rise: 3
percona_postgresql_haproxy_user: haproxy
percona_postgresql_haproxy_group: haproxy
percona_postgresql_haproxy_stats_ssl_enable: true
percona_postgresql_haproxy_stats_ssl_cert: "/etc/haproxy/certs/haproxy.pem"
percona_postgresql_haproxy_tcp_keepalive: true
percona_postgresql_haproxy_log_health_checks: true
percona_postgresql_haproxy_retries: 3


###############################################################################
# HAProxy Stats
###############################################################################

percona_postgresql_haproxy_stats_enable: true

percona_postgresql_haproxy_stats_port: 443
percona_postgresql_haproxy_stats_uri: "/"
percona_postgresql_haproxy_stats_refresh: "10s"

###############################################################################
# Repository
###############################################################################

percona_postgresql_repo_url: "https://repo.percona.com/apt/percona-release_latest.{{ ansible_lsb.codename }}_all.deb"

###############################################################################
# PostgreSQL Common
###############################################################################

percona_postgresql_common_path: "/etc/postgresql-common"
percona_postgresql_createcluster_conf: "/etc/postgresql-common/createcluster.conf"

###############################################################################
# Packages
###############################################################################

percona_postgresql_packages:
  - acl
  - "percona-postgresql-{{ percona_postgresql_version }}"
  - "percona-postgresql-{{ percona_postgresql_version }}-pgaudit"
  - percona-patroni
  - "percona-pg-stat-monitor{{ percona_postgresql_version }}"
  - percona-postgresql-contrib
  - daemontools

###############################################################################
# Bootstrap
###############################################################################

percona_postgresql_bootstrap_method: "initdb"

percona_postgresql_initdb_options:
  - "encoding: UTF8"
  - "data-checksums"

###############################################################################
# Replication
###############################################################################

percona_postgresql_replication_enabled: true

percona_postgresql_use_pg_rewind: true
percona_postgresql_use_slots: true

###############################################################################
# PostgreSQL Parameters
###############################################################################

percona_postgresql_wal_level: "replica"
percona_postgresql_hot_standby: "on"

percona_postgresql_max_wal_senders: 10
percona_postgresql_max_replication_slots: 10
percona_postgresql_archive_timeout: "60s"
###############################################################################
# PostgreSQL Authentication
###############################################################################

percona_postgresql_admin_options:
  - createrole
  - createdb

###############################################################################
# Network Access
###############################################################################

percona_postgresql_replication_network: ""
percona_postgresql_client_network: ""


percona_postgresql_pg_hba:
  - "local all postgres peer"
  - "local all all peer"

  # Required for WAL-G base backups when PGUSER=postgres
  - "local replication postgres peer"

  - "local replication {{ percona_postgresql_replica_user }} peer"
  - "host replication {{ percona_postgresql_replica_user }} 127.0.0.1/32 md5"
  - "host replication {{ percona_postgresql_replica_user }} ::1/128 md5"

  - "host all all 127.0.0.1/32 md5"
  - "host all all ::1/128 md5"

  - "host replication {{ percona_postgresql_replica_user }} {{ percona_postgresql_replication_network }} md5"

  # Patroni health checks
  - "host all postgres {{ percona_postgresql_replication_network }} md5"

  # Applications
  - "host all all {{ percona_postgresql_client_network }} md5"

###############################################################################
# PostgreSQL DR Configuration
###############################################################################

percona_postgresql_enable_dr: true

###############################################################################
# PostgreSQL Performance
###############################################################################

percona_postgresql_max_connections: 300

percona_postgresql_shared_buffers: "2GB"
percona_postgresql_effective_cache_size: "6GB"
percona_postgresql_work_mem: "16MB"
percona_postgresql_maintenance_work_mem: "512MB"

percona_postgresql_checkpoint_timeout: "15min"
percona_postgresql_checkpoint_completion_target: 0.9

percona_postgresql_random_page_cost: 1.1
percona_postgresql_effective_io_concurrency: 200

percona_postgresql_max_worker_processes: 8
percona_postgresql_max_parallel_workers: 8
percona_postgresql_max_parallel_workers_per_gather: 4

percona_postgresql_wal_compression: "on"

###############################################################################
# PostgreSQL Logging
###############################################################################

percona_postgresql_logging_collector: "on"

percona_postgresql_log_connections: "on"
percona_postgresql_log_disconnections: "on"
percona_postgresql_log_checkpoints: "on"
percona_postgresql_log_lock_waits: "on"

percona_postgresql_log_min_duration_statement: 1000

percona_postgresql_hot_standby_feedback: "on"

percona_postgresql_track_io_timing: "on"

percona_postgresql_track_wal_io_timing: "on"

percona_postgresql_tcp_keepalives_idle: 60

percona_postgresql_tcp_keepalives_interval: 10

percona_postgresql_tcp_keepalives_count: 6

percona_postgresql_log_replication_commands: "on"

percona_postgresql_log_temp_files: 0

percona_postgresql_log_autovacuum_min_duration: 0
###############################################################################
# PostgreSQL Extensions
###############################################################################

# Libraries loaded during PostgreSQL startup
percona_postgresql_shared_preload_libraries:
  - pg_stat_statements
  - auto_explain

# SQL endpoint (HAProxy write endpoint)
percona_postgresql_sql_host: "192.168.8.2"
percona_postgresql_sql_port: 5000

###############################################################################
# WAL-G Configuration
###############################################################################

percona_postgresql_walg_version: "v3.0.5"

percona_postgresql_walg_os: "ubuntu"
percona_postgresql_walg_os_version: "22.04"
percona_postgresql_walg_arch: "amd64"

percona_postgresql_walg_binary: "wal-g-pg-{{ percona_postgresql_walg_os }}-{{ percona_postgresql_walg_os_version }}-{{ percona_postgresql_walg_arch }}.tar.gz"

percona_postgresql_walg_download_url: "https://github.com/wal-g/wal-g/releases/download/{{ percona_postgresql_walg_version }}/{{ percona_postgresql_walg_binary }}"

percona_postgresql_walg_download_dest: "/tmp/wal-g.tar.gz"
percona_postgresql_walg_extract_dir: "/tmp"

percona_postgresql_walg_install_path: "/usr/local/bin/wal-g"
percona_postgresql_walg_binary_name: "wal-g-pg-ubuntu-22.04-amd64"

percona_postgresql_walg_envdir: "/etc/wal-g.d/env"
percona_postgresql_walg_backup_dir: "/var/lib/postgresql/backups"

percona_postgresql_wal_keep_size: "4GB"
percona_postgresql_max_slot_wal_keep_size: "20GB"

###############################################################################
# WAL Archive
###############################################################################

percona_postgresql_archive_mode: "on"

percona_postgresql_archive_command: "envdir {{ percona_postgresql_walg_envdir }} wal-g wal-push %p"

percona_postgresql_restore_command: "/usr/local/bin/wal-g wal-fetch %f %p"
###############################################################################
# MinIO Configuration
###############################################################################

percona_postgresql_minio_endpoint: "https://minio.ldc.opstree.dev:9000"
percona_postgresql_minio_bucket: "postgres-backup"

percona_postgresql_walg_s3_prefix: "s3://{{ percona_postgresql_minio_bucket }}"

###############################################################################
# Backup Scripts
###############################################################################

percona_postgresql_walg_full_backup_script: "/usr/local/bin/postgres_full_backup.sh"

percona_postgresql_walg_restore_script: "/usr/local/bin/postgres_restore.sh"
percona_postgresql_walg_retention_script: "/usr/local/bin/postgres_retention.sh"

percona_postgresql_daily_backup_script: "/usr/local/bin/postgres_daily_backup.sh"
percona_postgresql_weekly_backup_script: "/usr/local/bin/postgres_weekly_backup.sh"
percona_postgresql_monthly_backup_script: "/usr/local/bin/postgres_monthly_backup.sh"

###############################################################################
# Backup Schedule
###############################################################################
percona_postgresql_walg_delta_backup_minute: "0"
percona_postgresql_walg_delta_backup_hour: "*/6"

percona_postgresql_walg_retention_minute: "30"
percona_postgresql_walg_retention_hour: "3"

###############################################################################
# Daily Backup Schedule
###############################################################################

percona_postgresql_daily_backup_minute: "0"
percona_postgresql_daily_backup_hour: "1"

###############################################################################
# Weekly Backup Schedule
###############################################################################

percona_postgresql_weekly_backup_minute: "0"
percona_postgresql_weekly_backup_hour: "2"

# Sunday (0-6)
percona_postgresql_weekly_backup_day: "0"

###############################################################################
# Monthly Backup Schedule
###############################################################################

percona_postgresql_monthly_backup_minute: "0"
percona_postgresql_monthly_backup_hour: "3"

percona_postgresql_monthly_backup_day: "1"

###############################################################################
# Retention Cleanup Schedule
###############################################################################

percona_postgresql_retention_cleanup_minute: "30"
percona_postgresql_retention_cleanup_hour: "3"

###############################################################################
# Retention Policy
###############################################################################

percona_postgresql_daily_retention_days: 6
percona_postgresql_weekly_retention_weeks: 4
percona_postgresql_monthly_retention_months: 6

percona_postgresql_walg_retention_full: 7

###############################################################################
# WAL-G Environment Directories
###############################################################################

percona_postgresql_walg_daily_envdir: "/etc/wal-g.d/daily/env"
percona_postgresql_walg_weekly_envdir: "/etc/wal-g.d/weekly/env"
percona_postgresql_walg_monthly_envdir: "/etc/wal-g.d/monthly/env"

###############################################################################
# Backup Storage Prefixes
###############################################################################

percona_postgresql_walg_main_prefix: "s3://{{ percona_postgresql_minio_bucket }}"
percona_postgresql_walg_daily_prefix: "s3://{{ percona_postgresql_minio_bucket }}/daily"
percona_postgresql_walg_weekly_prefix: "s3://{{ percona_postgresql_minio_bucket }}/weekly"
percona_postgresql_walg_monthly_prefix: "s3://{{ percona_postgresql_minio_bucket }}/monthly"

###############################################################################
# Safety Controls
###############################################################################

percona_postgresql_force_clean: false
percona_postgresql_force_rebuild: false
percona_postgresql_allow_destructive: false


###############################################################################
# Node Exporter
###############################################################################

percona_postgresql_enable_node_exporter: true

percona_postgresql_node_exporter_version: "1.9.1"
percona_postgresql_node_exporter_arch: "linux-amd64"

percona_postgresql_node_exporter_user: "node_exporter"
percona_postgresql_node_exporter_group: "node_exporter"

percona_postgresql_node_exporter_install_dir: "/usr/local/bin"
percona_postgresql_node_exporter_binary: "{{ percona_postgresql_node_exporter_install_dir }}/node_exporter"

percona_postgresql_node_exporter_download_dest: "/tmp/node_exporter.tar.gz"

percona_postgresql_node_exporter_download_url: "https://github.com/prometheus/node_exporter/releases/download/v{{ percona_postgresql_node_exporter_version }}/node_exporter-{{ percona_postgresql_node_exporter_version }}.{{ percona_postgresql_node_exporter_arch }}.tar.gz"

percona_postgresql_node_exporter_service_file: "/etc/systemd/system/node_exporter.service"

percona_postgresql_node_exporter_collectors:
  - "--collector.systemd"
  - "--collector.processes"
  
###############################################################################
# PostgreSQL Exporter
###############################################################################

percona_postgresql_enable_postgres_exporter: true

percona_postgresql_exporter_version: "0.18.0"
percona_postgresql_exporter_arch: "linux-amd64"

percona_postgresql_exporter_user: "exporter"
percona_postgresql_exporter_group: "exporter"

percona_postgresql_exporter_install_dir: "/usr/local/bin"
percona_postgresql_exporter_binary: "{{ percona_postgresql_exporter_install_dir }}/postgres_exporter"

percona_postgresql_exporter_download_dest: "/tmp/postgres_exporter.tar.gz"

percona_postgresql_exporter_download_url: "https://github.com/prometheus-community/postgres_exporter/releases/download/v{{ percona_postgresql_exporter_version }}/postgres_exporter-{{ percona_postgresql_exporter_version }}.{{ percona_postgresql_exporter_arch }}.tar.gz"

percona_postgresql_exporter_config_dir: "/etc/postgres_exporter"

percona_postgresql_exporter_service_file: "/etc/systemd/system/postgres_exporter.service"

percona_postgresql_exporter_listen_address: "0.0.0.0"
percona_postgresql_exporter_port: 9187

percona_postgresql_exporter_web_listen_address: "{{ percona_postgresql_exporter_listen_address }}:{{ percona_postgresql_exporter_port }}"

percona_postgresql_exporter_data_source_uri: "localhost:{{ percona_postgresql_pg_port }}/postgres?sslmode=disable"

percona_postgresql_exporter_password: ""
percona_postgresql_exporter_queries_file: "/etc/postgres_exporter/queries.yaml"
percona_postgresql_exporter_collectors:
  - "--collector.statio_user_tables"
  - "--collector.stat_user_tables"
  - "--collector.statio_user_indexes"
  - "--collector.stat_wal_receiver"
